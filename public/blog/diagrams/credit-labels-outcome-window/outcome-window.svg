<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 280" role="img" aria-labelledby="title desc">
  <title id="title">Outcome window timeline</title>
  <desc id="desc">Timeline from origination through outcome window to label maturity.</desc>
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="var(--diagram-svg-tint-amber)"/>
      <stop offset="100%" stop-color="var(--diagram-svg-tint-amber-2)"/>
    </linearGradient>
    <linearGradient id="band" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="var(--diagram-svg-tint-amber-stroke)" stop-opacity="0.35"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="820" height="280" fill="var(--diagram-svg-canvas)" rx="12"/>
  <!-- outcome window band -->
  <rect x="140" y="92" width="420" height="96" rx="10" fill="url(#band)" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.45"/>
  <text x="350" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#92400e">Outcome window</text>
  <text x="350" y="138" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#78350f" opacity="0.9">Observe DPD / status through cut-off that defines &#8220;bad&#8221;</text>
  <!-- T0 -->
  <g filter="url(#soft)">
    <rect x="32" y="100" width="96" height="80" rx="10" fill="url(#card)" stroke="var(--diagram-svg-border)" stroke-width="1"/>
  </g>
  <text x="80" y="128" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="var(--diagram-svg-text)">T&#8320;</text>
  <text x="80" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="var(--diagram-svg-axis)">Origination</text>
  <!-- arrows -->
  <path d="M 132 140 L 148 140" stroke="var(--diagram-svg-muted)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="148,140 138,135 138,145" fill="var(--diagram-svg-muted)"/>
  <path d="M 564 140 L 580 140" stroke="var(--diagram-svg-muted)" stroke-width="2" stroke-linecap="round"/>
  <polygon points="580,140 570,135 570,145" fill="var(--diagram-svg-muted)"/>
  <!-- label maturity -->
  <g filter="url(#soft)">
    <rect x="592" y="96" width="196" height="88" rx="10" fill="var(--diagram-svg-canvas)" stroke="#c4b5fd" stroke-width="1.5"/>
  </g>
  <text x="690" y="128" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="600" fill="#4c1d95">Label maturity</text>
  <text x="690" y="152" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="11" fill="#6b21a8">Enough horizon to assign &#8220;bad / good&#8221;</text>
  <!-- footnote line -->
  <line x1="48" y1="218" x2="772" y2="218" stroke="var(--diagram-svg-border)" stroke-width="1"/>
  <text x="410" y="248" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10.5" fill="var(--diagram-svg-muted)">Too short &#8594; miss real bad &#183; too long &#8594; immature cohort, bad rate underestimated</text>
</svg>
