<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 300" role="img" aria-labelledby="title desc">
  <title id="title">Rank versus calibrated PD purpose</title>
  <desc id="desc">Two columns: rank uses AUC Gini KS without calibration; PD estimate needs Brier ECE reliability diagram with calibration.</desc>
  <rect width="860" height="300" fill="var(--diagram-svg-canvas)" rx="12"/>
  <text x="430" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="var(--diagram-svg-text)" font-family="ui-sans-serif, system-ui, sans-serif">Two questions  -  two metric families</text>

  <rect x="48" y="58" width="360" height="210" rx="10" fill="var(--diagram-svg-tint-blue)" stroke="var(--diagram-svg-tint-blue-stroke)"/>
  <text x="228" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#1e40af" font-family="ui-sans-serif, system-ui, sans-serif">A  -  Rank (discrimination)</text>
  <text x="228" y="118" text-anchor="middle" font-size="12" fill="#1e3a8a" font-family="ui-sans-serif, system-ui, sans-serif">Who is riskier than whom?</text>
  <text x="72" y="152" font-size="12" fill="var(--diagram-svg-text-secondary)" font-family="ui-sans-serif, system-ui, sans-serif">Metrics: AUC, Gini, KS</text>
  <text x="72" y="176" font-size="12" fill="var(--diagram-svg-text-secondary)" font-family="ui-sans-serif, system-ui, sans-serif">Use: model pick, approve/reject rank</text>
  <text x="72" y="212" font-size="12" font-weight="600" fill="#1d4ed8" font-family="ui-sans-serif, system-ui, sans-serif">Calibration: not required</text>

  <rect x="452" y="58" width="360" height="210" rx="10" fill="var(--diagram-svg-tint-amber)" stroke="var(--diagram-svg-tint-amber-stroke)"/>
  <text x="632" y="92" text-anchor="middle" font-size="14" font-weight="700" fill="#92400e" font-family="ui-sans-serif, system-ui, sans-serif">B  -  Estimate PD (calibration)</text>
  <text x="632" y="118" text-anchor="middle" font-size="12" fill="#78350f" font-family="ui-sans-serif, system-ui, sans-serif">What is the default probability?</text>
  <text x="476" y="152" font-size="12" fill="var(--diagram-svg-text-secondary)" font-family="ui-sans-serif, system-ui, sans-serif">Metrics: Brier, ECE, reliability diagram</text>
  <text x="476" y="176" font-size="12" fill="var(--diagram-svg-text-secondary)" font-family="ui-sans-serif, system-ui, sans-serif">Use: pricing, ECL, portfolio PD</text>
  <text x="476" y="212" font-size="12" font-weight="600" fill="#b45309" font-family="ui-sans-serif, system-ui, sans-serif">Calibration: required</text>

  <text x="430" y="286" text-anchor="middle" font-size="11" fill="var(--diagram-svg-muted)" font-family="ui-sans-serif, system-ui, sans-serif">High AUC does not imply honest PD scale</text>
</svg>
