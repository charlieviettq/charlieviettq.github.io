<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Model calibration workflow</title>
  <desc id="desc">Train base model, fit calibration on unseen set, evaluate on test, deploy dual outputs.</desc>
  <defs>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <linearGradient id="cardWarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="cardOk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6b7280"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>
  <style>
    text { font-family: ui-sans-serif, system-ui, sans-serif; }
  </style>
  <rect width="960" height="520" fill="#fafaf9" rx="12"/>
  <text x="480" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#292524">Calibration workflow (offline)</text>
  <text x="480" y="56" text-anchor="middle" font-size="11" fill="#78716c">Calibration set must be unseen during training, feature selection, and tuning</text>

  <rect x="40" y="78" width="880" height="100" rx="10" fill="#f5f5f4" stroke="#e7e5e4" stroke-dasharray="5 3"/>
  <text x="56" y="100" font-size="11" font-weight="700" fill="#78716c">DATA SPLIT</text>

  <g filter="url(#soft)">
    <rect x="72" y="112" width="200" height="52" rx="8" fill="url(#card)" stroke="#93c5fd"/>
  </g>
  <text x="172" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#1e3a8a">Train set (~60%)</text>
  <text x="172" y="154" text-anchor="middle" font-size="10" fill="#1d4ed8">Features + base model</text>

  <g filter="url(#soft)">
    <rect x="380" y="112" width="200" height="52" rx="8" fill="url(#cardWarn)" stroke="#fcd34d"/>
  </g>
  <text x="480" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e">Calibration set (~20%)</text>
  <text x="480" y="154" text-anchor="middle" font-size="10" fill="#b45309">OOT or holdout - unseen</text>

  <g filter="url(#soft)">
    <rect x="688" y="112" width="200" height="52" rx="8" fill="#fafafa" stroke="#d4d4d8"/>
  </g>
  <text x="788" y="136" text-anchor="middle" font-size="12" font-weight="600" fill="#3f3f46">Test set (~20%)</text>
  <text x="788" y="154" text-anchor="middle" font-size="10" fill="#71717a">Final evaluation once</text>

  <path d="M 172 168 L 172 208" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 480 168 L 480 248" stroke="#ea580c" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 788 168 L 788 368" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>

  <g filter="url(#soft)">
    <rect x="72" y="212" width="200" height="56" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  </g>
  <text x="172" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#1e40af">Base model</text>
  <text x="172" y="256" text-anchor="middle" font-size="10" fill="#3b82f6">Boosting / GLM / ensemble</text>

  <path d="M 272 240 L 368 268" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#soft)">
    <rect x="368" y="248" width="224" height="56" rx="8" fill="url(#cardWarn)" stroke="#f59e0b" stroke-width="1.5"/>
  </g>
  <text x="480" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Calibration layer</text>
  <text x="480" y="292" text-anchor="middle" font-size="10" fill="#b45309">Platt / isotonic (cv=prefit)</text>

  <path d="M 592 276 L 688 396" stroke="#6b7280" stroke-width="2" marker-end="url(#arrowGray)"/>

  <g filter="url(#soft)">
    <rect x="608" y="368" width="312" height="88" rx="10" fill="url(#cardOk)" stroke="#34d399"/>
  </g>
  <text x="764" y="396" text-anchor="middle" font-size="12" font-weight="700" fill="#065f46">Production outputs</text>
  <text x="640" y="420" font-size="11" fill="#047857">raw_score: rank / approve-reject</text>
  <text x="640" y="438" font-size="11" fill="#047857">calibrated_pd: pricing / ECL / limits</text>

  <g filter="url(#soft)">
    <rect x="688" y="318" width="200" height="44" rx="8" fill="#ffffff" stroke="#a1a1aa"/>
  </g>
  <text x="788" y="338" text-anchor="middle" font-size="11" font-weight="600" fill="#52525b">Test: Brier, ECE, reliability plot</text>
  <text x="788" y="354" text-anchor="middle" font-size="10" fill="#71717a">AUC should stay nearly unchanged</text>

  <rect x="40" y="468" width="880" height="36" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="56" y="490" font-size="10.5" fill="#991b1b">Do not calibrate on validation used for early stopping, RFE, or hyperparameter search.</text>
</svg>
