<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" role="img" aria-labelledby="title desc">
  <title id="title">Reading one point on a reliability diagram</title>
  <desc id="desc">Example bin with mean predicted PD 10 percent and observed default rate 6 percent, below the perfect calibration diagonal.</desc>
  <rect width="820" height="440" fill="#fafaf9" rx="12"/>
  <text x="410" y="36" text-anchor="middle" font-size="16" font-weight="700" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">One bin = one point (conf_b, acc_b)</text>
  <text x="410" y="56" text-anchor="middle" font-size="11" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">2,000 accounts | mean predicted PD 10% | 120 defaults | observed 6%</text>

  <rect x="72" y="78" width="360" height="320" fill="#ffffff" stroke="#e7e5e4" stroke-width="1" rx="8"/>
  <line x1="92" y1="378" x2="412" y2="378" stroke="#57534e" stroke-width="1.5"/>
  <line x1="92" y1="98" x2="92" y2="378" stroke="#57534e" stroke-width="1.5"/>
  <text x="252" y="408" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">Mean predicted PD (X)</text>
  <text x="48" y="238" text-anchor="middle" font-size="12" fill="#44403c" transform="rotate(-90 48 238)" font-family="ui-sans-serif, system-ui, sans-serif">Observed default rate (Y)</text>

  <text x="102" y="372" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">0</text>
  <text x="252" y="372" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">0.10</text>
  <text x="402" y="372" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">0.20</text>
  <text x="82" y="378" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">0</text>
  <text x="82" y="318" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">0.06</text>
  <text x="82" y="238" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">0.12</text>
  <text x="82" y="158" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">0.18</text>

  <line x1="102" y1="368" x2="402" y2="128" stroke="#a8a29e" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="330" y="200" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">Perfect: Y = X</text>

  <circle cx="102" cy="368" r="3" fill="#a8a29e"/>
  <circle cx="402" cy="128" r="3" fill="#a8a29e"/>

  <line x1="252" y1="368" x2="252" y2="212" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="92" y1="212" x2="252" y2="212" stroke="#dc2626" stroke-width="1" stroke-dasharray="4 3"/>
  <circle cx="252" cy="212" r="9" fill="#dc2626" stroke="#ffffff" stroke-width="2"/>
  <text x="268" y="206" font-size="11" font-weight="700" fill="#dc2626" font-family="ui-sans-serif, system-ui, sans-serif">(0.10, 0.06)</text>

  <path d="M 268 220 L 300 250" stroke="#dc2626" stroke-width="1.2" fill="none"/>
  <text x="305" y="258" font-size="10.5" fill="#991b1b" font-family="ui-sans-serif, system-ui, sans-serif">Below diagonal</text>
  <text x="305" y="274" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">Overconfident at this bin</text>

  <rect x="460" y="88" width="328" height="300" rx="10" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="480" y="118" font-size="13" font-weight="700" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">How to read</text>
  <text x="480" y="148" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">X = mean(PD) in bin = 10%</text>
  <text x="480" y="172" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">Y = bad / N = 120 / 2000 = 6%</text>
  <text x="480" y="208" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">Y &lt; X: model predicts higher risk</text>
  <text x="480" y="228" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">than realized in this band</text>

  <rect x="480" y="252" width="288" height="56" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="492" y="274" font-size="11" font-weight="600" fill="#991b1b" font-family="ui-sans-serif, system-ui, sans-serif">If PD drives pricing or ECL</text>
  <text x="492" y="292" font-size="10.5" fill="#7f1d1d" font-family="ui-sans-serif, system-ui, sans-serif">this band may be priced too conservatively vs actual loss</text>

  <rect x="480" y="322" width="288" height="52" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="492" y="344" font-size="11" font-weight="600" fill="#1e40af" font-family="ui-sans-serif, system-ui, sans-serif">Contrast: (0.08, 0.11) sits above diagonal</text>
  <text x="492" y="362" font-size="10.5" fill="#1e3a8a" font-family="ui-sans-serif, system-ui, sans-serif">local underconfident: predicted lower than actual</text>
</svg>
