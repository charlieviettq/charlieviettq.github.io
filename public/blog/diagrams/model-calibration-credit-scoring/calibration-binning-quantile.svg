<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" role="img" aria-labelledby="title desc">
  <title id="title">Equal-frequency bins for reliability diagram</title>
  <desc id="desc">Sort accounts by predicted PD, split into quantile bins with similar count per bin.</desc>
  <rect width="880" height="360" fill="#fafaf9" rx="12"/>
  <text x="440" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">Equal-frequency bins (quantile)</text>
  <text x="440" y="54" text-anchor="middle" font-size="11" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">Sort by predicted PD, then split so each bin has ~N/k accounts</text>

  <text x="48" y="88" font-size="11" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif">Low PD</text>
  <line x1="120" y1="100" x2="820" y2="100" stroke="#e7e5e4" stroke-width="1"/>
  <rect x="120" y="112" width="155" height="44" rx="6" fill="#ecfdf5" stroke="#6ee7b7"/>
  <rect x="285" y="112" width="155" height="44" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
  <rect x="450" y="112" width="155" height="44" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <rect x="615" y="112" width="155" height="44" rx="6" fill="#fef2f2" stroke="#fca5a5"/>
  <rect x="780" y="112" width="40" height="44" rx="6" fill="#f5f5f4" stroke="#d6d3d1" stroke-dasharray="4 3"/>
  <text x="197" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46" font-family="ui-sans-serif, system-ui, sans-serif">Bin 1</text>
  <text x="362" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#1e40af" font-family="ui-sans-serif, system-ui, sans-serif">Bin 2</text>
  <text x="527" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#92400e" font-family="ui-sans-serif, system-ui, sans-serif">Bin 3</text>
  <text x="692" y="138" text-anchor="middle" font-size="12" font-weight="600" fill="#991b1b" font-family="ui-sans-serif, system-ui, sans-serif">Bin 4</text>
  <text x="800" y="138" text-anchor="middle" font-size="10" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">...</text>

  <text x="48" y="188" font-size="11" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif">N per bin</text>
  <text x="197" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">1,000</text>
  <text x="362" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">1,000</text>
  <text x="527" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">1,000</text>
  <text x="692" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">1,000</text>

  <text x="48" y="228" font-size="11" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif">Mean pred PD</text>
  <text x="197" y="228" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">2.0%</text>
  <text x="362" y="228" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">5.0%</text>
  <text x="527" y="228" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">10.0%</text>
  <text x="692" y="228" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">22.0%</text>

  <text x="48" y="268" font-size="11" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif">Observed rate</text>
  <text x="197" y="268" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">0.8%</text>
  <text x="362" y="268" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">3.5%</text>
  <text x="527" y="268" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">8.2%</text>
  <text x="692" y="268" text-anchor="middle" font-size="12" fill="#44403c" font-family="ui-sans-serif, system-ui, sans-serif">17.5%</text>

  <path d="M 197 290 L 248 320" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 362 290 L 320 320" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 527 290 L 400 320" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 692 290 L 480 320" stroke="#2563eb" stroke-width="1.5" marker-end="url(#arr)"/>
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>
  <rect x="248" y="300" width="384" height="48" rx="8" fill="#ffffff" stroke="#e7e5e4"/>
  <text x="440" y="322" text-anchor="middle" font-size="12" font-weight="600" fill="#292524" font-family="ui-sans-serif, system-ui, sans-serif">One point per bin on reliability diagram: (mean pred PD, observed rate)</text>
  <text x="440" y="340" text-anchor="middle" font-size="10.5" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif">sklearn: calibration_curve(..., strategy=&quot;quantile&quot;)</text>
  <text x="820" y="88" text-anchor="end" font-size="11" fill="#57534e" font-family="ui-sans-serif, system-ui, sans-serif">High PD</text>
</svg>
