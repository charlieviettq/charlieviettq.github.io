<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" role="img" aria-labelledby="tax-title tax-desc">
  <title id="tax-title">Retail credit taxonomy by repayment mechanism</title>
  <desc id="tax-desc">Installment term loans, revolving credit cards, commerce-linked BNPL, and short-term unsecured credit as distinct families.</desc>
  <rect width="720" height="200" fill="var(--diagram-svg-canvas)" rx="10"/>
  <text x="360" y="28" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="var(--diagram-svg-text)">Taxonomy by mechanism (not marketing name)</text>
  <!-- row of four boxes -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="24" y="52" width="156" height="120" rx="10" fill="var(--diagram-svg-tint-amber)" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.55"/>
    <text x="102" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#92400e">Term installment</text>
    <text x="102" y="102" text-anchor="middle" font-size="10" fill="#78350f">Cash / personal loan</text>
    <text x="102" y="122" text-anchor="middle" font-size="10" fill="#78350f">Auto-style schedules</text>
    <text x="102" y="148" text-anchor="middle" font-size="9.5" fill="var(--diagram-svg-muted)">Fixed tenor &#183; amortizing</text>

    <rect x="192" y="52" width="156" height="120" rx="10" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.2"/>
    <text x="270" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#5b21b6">Revolving</text>
    <text x="270" y="102" text-anchor="middle" font-size="10" fill="#6b21a8">Credit cards</text>
    <text x="270" y="122" text-anchor="middle" font-size="10" fill="#6b21a8">Lines of credit</text>
    <text x="270" y="148" text-anchor="middle" font-size="9.5" fill="var(--diagram-svg-muted)">Limit &#183; min payment path</text>

    <rect x="360" y="52" width="156" height="120" rx="10" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.2" stroke-opacity="0.65"/>
    <text x="438" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#155e75">Commerce-linked</text>
    <text x="438" y="102" text-anchor="middle" font-size="10" fill="#0e7490">BNPL / paylater</text>
    <text x="438" y="122" text-anchor="middle" font-size="10" fill="#0e7490">Split checkout flows</text>
    <text x="438" y="148" text-anchor="middle" font-size="9.5" fill="var(--diagram-svg-muted)">Often short installments</text>

    <rect x="528" y="52" width="168" height="120" rx="10" fill="var(--diagram-svg-tint-red)" stroke="#f87171" stroke-width="1.2" stroke-opacity="0.55"/>
    <text x="612" y="82" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">Ultra-short unsecured</text>
    <text x="612" y="102" text-anchor="middle" font-size="10" fill="#b91c1c">Payday-style</text>
    <text x="612" y="122" text-anchor="middle" font-size="10" fill="#b91c1c">Salary-linked / HCSTC</text>
    <text x="612" y="148" text-anchor="middle" font-size="9.5" fill="var(--diagram-svg-muted)">High fee regimes vary</text>
  </g>
  <text x="360" y="188" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="9.5" fill="var(--diagram-svg-muted)">Same marketing label can map to different mechanisms across VN / ASEAN / global charters.</text>
</svg>
